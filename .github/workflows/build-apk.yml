name: Build APK

# Builds WeHavePhones Dev (com.wehavephones.dev) with scripts/build-wehavephones.sh.
#   - Actions tab > Build APK > Run workflow: builds the APK and keeps it as a
#     download on the run page. Enter a tag (e.g. v0.1-fork) to also publish
#     it as a GitHub Release.
#   - Pushing a tag v* builds and publishes a Release for that tag.
#
# Signing: set the repository secret DEBUG_KEYSTORE_B64 to the base64 of the
# keystore your own builds use (e.g. ~/.android/debug.keystore), so a CI APK
# installs as an update over them and over each other. Without it every run
# signs with a new key, and Android refuses to install it over an earlier build.
# Optional secrets KEYSTORE_PASS, KEY_ALIAS, KEY_PASS default to the Android
# debug keystore's (android / androiddebugkey / android).

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish as a GitHub Release with this tag (empty: build only)"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/setup-dev.sh') }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Set up JDK 17 and Android SDK/NDK
        run: scripts/setup-dev.sh

      - name: Signing key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "::warning::DEBUG_KEYSTORE_B64 is not set: this APK is signed with a new key and will not install over an earlier build."
            exit 0
          fi
          keystore="$RUNNER_TEMP/signing.keystore"
          printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > "$keystore"
          {
            echo "WEHAVEPHONES_KEYSTORE=$keystore"
            echo "WEHAVEPHONES_KEYSTORE_PASS=${KEYSTORE_PASS:-android}"
            echo "WEHAVEPHONES_KEY_ALIAS=${KEY_ALIAS:-androiddebugkey}"
            echo "WEHAVEPHONES_KEY_PASS=${KEY_PASS:-android}"
          } >> "$GITHUB_ENV"

      - name: Build
        run: scripts/build-wehavephones.sh

      - name: Name the APK
        id: apk
        run: |
          short=$(git rev-parse --short HEAD)
          name="WeHavePhones-Dev-${short}.apk"
          mkdir -p out/ci
          cp app/build/outputs/apk/wehavephones/debug/app-wehavephones-debug.apk "out/ci/$name"
          (cd out/ci && sha256sum "$name" > SHA256SUMS)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          cat out/ci/SHA256SUMS

      - name: Upload APK to the run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: out/ci/
          retention-days: 30

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
        run: |
          notes="Built from $(git rev-parse --short HEAD) by GitHub Actions.

          Installs as **WeHavePhones Dev** (com.wehavephones.dev), next to the official app.
          Tested only with a 1.12.1 (vanilla) client; other versions are untested.
          See docs/CUSTOM_CLIENTS.md and docs/CLASSIC_CONTROLLERS.md."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/ci/* --clobber
          else
            gh release create "$TAG" out/ci/* --target "$GITHUB_SHA" --title "$TAG" --notes "$notes" --prerelease
          fi
